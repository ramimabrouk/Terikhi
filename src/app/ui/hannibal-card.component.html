<article class="hannibal-card" [class.is-open]="isOpen()">
  <div
    class="portrait"
    [style.--image-x]="imageX()"
    [style.--image-y]="imageY()"
    (pointermove)="moveImage($event)"
    (pointerleave)="resetImage()"
  >
    <img
      class="portrait-image"
      src="/images/hannibal.jpg"
      alt="Statue de Hannibal Barca, général carthaginois"
    />
    <div class="portrait-shade" aria-hidden="true"></div>
    <span class="portrait-label">Carthage · IIIe siècle av. J.-C.</span>
  </div>

  <div class="card-content">
    <div>
      <p class="eyebrow">Figure tutélaire</p>
      <h2>Hannibal <em>Barca</em></h2>
    </div>
    <button
      type="button"
      class="details-toggle"
      [attr.aria-expanded]="isOpen()"
      aria-controls="hannibal-note"
      (click)="toggleDetails()"
    >
      <span>{{ isOpen() ? 'Refermer' : 'Découvrir' }}</span>
      <span class="toggle-mark" aria-hidden="true">{{ isOpen() ? '−' : '+' }}</span>
    </button>
  </div>

  @if (isOpen()) {
    <div class="hannibal-note" id="hannibal-note">
      <p>
        Stratège carthaginois, Hannibal traverse les Alpes en 218 av. J.-C. Son audace
        militaire reste l’un des grands récits de la Méditerranée antique.
      </p>
      <span class="note-source">Portrait · Musée du Louvre</span>
    </div>
  }
</article>
