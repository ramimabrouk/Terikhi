@if (request(); as gallery) {
  <section class="gallery-panel" [attr.aria-label]="i18n.t('gallery')">
    <header class="gallery-header">
      <div>
        <p class="eyebrow">{{ gallery.categoryLabel }} · {{ gallery.cityName }}</p>
        <h2>{{ gallery.item.title }}</h2>
      </div>
      <button type="button" class="gallery-close" [attr.aria-label]="i18n.t('closeGallery')" (click)="closed.emit()">
        ×
      </button>
    </header>

    <div class="gallery-view">
      <img [src]="displayedImage()" [alt]="gallery.item.title + ' · ' + gallery.cityName" />
      <span>{{ gallery.item.images.length }} {{ i18n.t('photos') }}</span>
    </div>

    <div class="gallery-thumbs" [attr.aria-label]="i18n.t('choosePhoto')">
      @for (image of gallery.item.images; track image) {
        <button
          type="button"
          class="gallery-thumb"
          [class.is-active]="displayedImage() === image"
          [attr.aria-label]="i18n.t('showPhoto') + ' ' + ($index + 1)"
          (click)="selectImage(image)"
        >
          <img [src]="image" alt="" />
        </button>
      }
    </div>
  </section>
}
